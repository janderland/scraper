name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Download dependencies
      run: |
        go mod download
        go mod tidy

    - name: Check for go.mod/go.sum changes
      run: |
        git diff --exit-code go.mod go.sum || {
          echo "Error: go.mod or go.sum has uncommitted changes after go mod tidy"
          echo "Please run 'go mod tidy' and commit the changes"
          exit 1
        }

    - name: Check formatting
      run: |
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$UNFORMATTED" ]; then
          echo "The following files need formatting:"
          echo "$UNFORMATTED"
          echo ""
          echo "Please run: gofmt -s -w ."
          exit 1
        fi

    - name: Go vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v ./...
      timeout-minutes: 10

    - name: Check test coverage
      run: |
        go test -coverprofile=coverage.out ./...
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Test coverage: ${COVERAGE}%"

        # Warn if coverage is below 50%
        if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          echo "⚠️  Warning: Test coverage is below 50%"
        fi

  size-check:
    name: Check Binary Size
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build and check size
      run: |
        go build -o scraper ./cmd/scraper
        SIZE=$(du -h scraper | cut -f1)
        echo "Binary size: $SIZE"

        # Get binary size in MB for comparison
        SIZE_MB=$(du -m scraper | cut -f1)
        if [ $SIZE_MB -gt 100 ]; then
          echo "⚠️  Warning: Binary size is over 100MB"
        fi
